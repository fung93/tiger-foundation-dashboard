name: Update UNI trade history
on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/update-uni-trades.yml', 'api/_uni-trades.mjs', 'uni-trade-core.mjs', 'scripts/uni-trades.mjs']
permissions:
  contents: write
concurrency:
  group: update-uni-trades
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record confirmed on-chain UNI swaps
        run: node scripts/uni-trades.mjs
      - name: Save independent UNI trade ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uni-trades.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore: update UNI trade history'
          git pull --rebase origin main
          git push origin HEAD:main
