name: Update UNI strategy cash history
on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/update-uni-strategy.yml', 'api/_uni-strategy-reader.mjs', 'uni-strategy-core.mjs', 'scripts/uni-strategy.mjs']
permissions:
  contents: write
concurrency:
  group: update-uni-strategy
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record verified UNI strategy receipts and cash
        run: node scripts/uni-strategy.mjs
      - name: Save independent strategy checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uni-strategy.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore: update UNI strategy cash history'
          git pull --rebase origin main
          git push origin HEAD:main
