<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<script src="/theme.js"></script>
<title>LP Range</title>
<link rel="manifest" href="/widget.webmanifest">
<link rel="icon" href="/icons/lp-192.png">
<link rel="apple-touch-icon" href="/icons/lp-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LP Range">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- the very card the LP Book draws, and its LIVE stamp -->
<link rel="stylesheet" href="/lpcards.css">
<!--
  LP range widget — the installed phone shortcut. It shows exactly the LP Book's live
  position cards: the same card (lpcards.js / lpcards.css) drawn from the same
  /api/lpbook view, so the two can never disagree. Tapping the masthead opens the full book.

  There is no copy of this under vercel/ — it lives at the root only. It does not
  register the service worker: a widget wants the live number, not a cached one.

  Query string:
    ?pos=<token id>   show only that position
-->
<style>
:root{
  --bg:#050505;--card:#0b0b0c;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.04);
  --text:#f2f0eb;--dim:#8f8b82;--faint:#58554f;
  --gold:#d6b97b;--up:#6fcf97;--down:#e0796d;--warn:#e2b75c;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font:400 13.5px/1.5 var(--sans);font-feature-settings:"tnum" 1,"cv11" 1;
  -webkit-font-smoothing:antialiased;letter-spacing:.005em;
  padding:0 16px max(20px,env(safe-area-inset-bottom))}
a{color:inherit}
/* the same Tiger Foundation masthead as Portfolio and both LP Book pages */
header{margin:0 -16px 16px;padding:24px 32px;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;min-width:0}
.hdr-brand{text-decoration:none;flex:0 0 auto;-webkit-user-select:none;user-select:none}
header h1{font:400 34px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
header h1 em{font-style:italic;color:var(--gold)}
header h1 b{font-weight:400;color:var(--text)}
header .sub{color:var(--dim);font-size:10.5px;font-weight:500;letter-spacing:.16em;margin-top:9px;white-space:nowrap}
header .stamp{min-width:0;flex:1 1 0;overflow:hidden}
.hdr-brand:focus-visible{outline:2px solid var(--gold);outline-offset:5px;border-radius:2px}
@media(max-width:768px){
  header{padding:16px}
  header h1{font-size:clamp(21px,6.6vw,27px);letter-spacing:.01em}
  header .sub{font-size:clamp(8px,2.4vw,10px);letter-spacing:.12em}
}
.lpw-grid{max-width:1240px;margin-left:auto;margin-right:auto}
.health{max-width:1240px;margin:10px auto 12px;border:1px solid rgba(226,183,92,.22);background:rgba(226,183,92,.05);color:#e9c98a;
  border-radius:12px;padding:9px 12px;font-size:12px;overflow-wrap:anywhere;display:none}
.health.on{display:block}
.empty{color:var(--faint);font-size:12.5px;padding:14px 0;font-style:italic}
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body class="themed-page">
<header>
  <div class="hdr-inner">
    <div class="theme-brand">
      <img class="theme-mascot" src="/icons/cute-tiger.svg" alt="" aria-hidden="true">
      <a class="hdr-brand" href="/lp.html" title="Open the LP Book"><h1><em>Tiger</em> <b>Foundation</b></h1><div class="sub">WEALTH &amp; INVESTMENT DASHBOARD</div></a>
    </div>
    <div class="theme-actions">
      <button class="theme-toggle" id="themeBtn" type="button" aria-pressed="false" aria-label="Switch to the cute tiger theme" title="Switch to the cute tiger theme"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
      <div class="stamp" id="stamp">LOADING<br>&nbsp;</div>
    </div>
  </div>
</header>
<div class="health" id="health" role="status" aria-live="polite"></div>
<div class="lpw-grid" id="cards"></div>

<script src="/lpcards.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pin = (new URLSearchParams(location.search).get('pos') || '').replace(/^#/, '');
  /* lastGood is eligible for a hold only while a full reading is displayed. */
  var lastGood = 0, lastRead = 0, failed = false, lastHealth = {};

  function paint(v) {
    var views = (v && v.live) || [];
    if (pin) views = views.filter(function (W) { return String(W.id).replace(/^#/, '') === pin; });
    $('cards').innerHTML = LPCards.list(views);
    LPCards.align($('cards'));
  }
  function stamp(bad) { if (bad !== undefined) failed = bad; LPCards.stamp($('stamp'), lastRead, failed); }
  function health(hl, held, message) {
    var msgs = [];
    Object.keys(hl.errors || {}).forEach(function (k) { msgs.push('Could not read ' + k + ': ' + hl.errors[k]); });
    Object.keys(hl.behind || {}).forEach(function (k) {
      if (hl.behind[k] > 0) msgs.push(k + ' is ' + hl.behind[k].toLocaleString('en-US') + ' blocks behind.');
    });
    if ((hl.unread || []).length) msgs.push('Open position(s) not valued this time: ' + hl.unread.join(', '));
    if ((hl.unpriced || []).length) msgs.push('No live price for ' + hl.unpriced.map(function (k) { return String(k).split('@')[0]; }).join(', '));
    if (held) msgs.push('Showing the last full reading until it can be read again.');
    if (message) msgs.push(message);
    $('health').innerHTML = msgs.map(LPCards.esc).join('<br>');
    $('health').className = 'health' + (msgs.length ? ' on' : '');
  }

  /* the LP Book's own last answer (same origin, same key) paints at once on opening */
  var KEY = 'tf_lpbook';
  try {
    var seed = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (seed && seed.v && seed.v.live) {
      var seedState = LPCards.readingState(seed.v, seed.t);
      lastHealth = seed.v.health || {};
      paint(seed.v); health(lastHealth, false, seedState.warning); lastRead = seedState.time;
      lastGood = seedState.partial ? 0 : lastRead; stamp(seedState.partial || !seedState.fresh);
    }
  } catch (e) {}

  /* opening fires both the first load and the visibility handler; a request in flight or
     barely finished stands */
  var inflight = false, lastTry = 0;
  function load() {
    var now = Date.now();
    if (document.hidden || inflight || now - lastTry < 3000) return;
    inflight = true; lastTry = now;
    LPCards.fetchBook()
      .then(function (v) {
        /* an answer that nothing is open is an answer; only a failed fetch keeps the last cards */
        if (!v || v.error || !v.live) throw new Error(v && v.error || 'Incomplete LP Book response');
        /* a chain that could not be read keeps the last full cards for a few minutes, as on the
           LP Book, and a partial answer is never saved as the last good one */
        var state = LPCards.readingState(v);
        lastHealth = v.health || {};
        if (!state.time && lastRead) {
          health(lastHealth, false, state.warning + ' Keeping the previous reading.'); stamp(true); return;
        }
        if (state.time && lastRead && state.time < lastRead) {
          health(lastHealth, false, 'An older LP Book reading was returned. Keeping the newer displayed reading.'); stamp(true); return;
        }
        if (state.partial && lastGood && Date.now() - lastGood < 5 * 60000) { health(lastHealth, true); stamp(true); return; }
        paint(v); health(lastHealth, false, state.warning); lastRead = state.time; lastGood = state.partial ? 0 : lastRead;
        stamp(state.partial || !state.fresh);
        if (!state.partial && state.fresh) try { localStorage.setItem(KEY, JSON.stringify({ t: lastGood, v: v })); } catch (e) {}
      })
      .catch(function () {
        health(lastHealth, false, 'The LP Book could not be refreshed. Keeping the previous reading and its original time.'); stamp(true);
      }).finally(function () { inflight = false; });
  }
  load();
  setInterval(load, 15000);                                  /* as on the LP Book */
  setInterval(function () { stamp(); }, 1000);               /* the clock keeps the warning state */
  /* a widget app may keep this alive and hidden for hours: refresh the moment it is shown */
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
