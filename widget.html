<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>LP Range</title>
<link rel="manifest" href="/widget.webmanifest">
<link rel="icon" href="/icons/lp-192.png">
<link rel="apple-touch-icon" href="/icons/lp-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LP Range">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- the very card the LP Book draws, and its LIVE stamp -->
<link rel="stylesheet" href="/lpcards.css">
<!--
  LP range widget — the installed phone shortcut. It shows exactly the LP Book's live
  position cards: the same card (lpcards.js / lpcards.css) drawn from the same
  /api/lpbook view, so the two can never disagree. Tapping the title opens the full book.

  There is no copy of this under vercel/ — it lives at the root only. It does not
  register the service worker: a widget wants the live number, not a cached one.

  Query string:
    ?pos=<token id>   show only that position
-->
<style>
:root{
  --bg:#050505;--card:#0b0b0c;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.04);
  --text:#f2f0eb;--dim:#8f8b82;--faint:#58554f;
  --gold:#d6b97b;--up:#6fcf97;--down:#e0796d;--warn:#e2b75c;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font:400 13.5px/1.5 var(--sans);font-feature-settings:"tnum" 1,"cv11" 1;
  -webkit-font-smoothing:antialiased;letter-spacing:.005em;
  padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
a{color:inherit}
header{max-width:1240px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
/* the serif title as on the LP Book: "LP" in gold italic, "Book" upright */
h1{font:400 26px/1 var(--serif);letter-spacing:.01em}
h1 a{text-decoration:none}
h1 em{font-style:italic;color:var(--gold)}
h1 b{font-weight:400;color:var(--text)}
.lpw-grid{max-width:1240px;margin-left:auto;margin-right:auto}
.empty{color:var(--faint);font-size:12.5px;padding:14px 0;font-style:italic}
</style>
</head>
<body>
<header>
  <h1><a href="/lp.html" title="Open the LP Book"><em>LP</em> <b>Book</b></a></h1>
  <div class="stamp" id="stamp">LOADING<br>&nbsp;</div>
</header>
<div class="lpw-grid" id="cards"></div>

<script src="/lpcards.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pin = (new URLSearchParams(location.search).get('pos') || '').replace(/^#/, '');
  var lastGood = 0;

  function paint(v) {
    var views = (v && v.live) || [];
    if (pin) views = views.filter(function (W) { return String(W.id).replace(/^#/, '') === pin; });
    $('cards').innerHTML = LPCards.list(views);
  }
  function stamp(failed) { LPCards.stamp($('stamp'), lastGood, failed); }

  /* the LP Book's own last answer (same origin, same key) paints at once on opening */
  var KEY = 'tf_lpbook';
  try { var seed = JSON.parse(localStorage.getItem(KEY) || 'null'); if (seed && seed.v && seed.v.live) { paint(seed.v); lastGood = seed.t; stamp(false); } } catch (e) {}

  /* opening fires both the first load and the visibility handler; a request in flight or
     barely finished stands */
  var inflight = false, lastTry = 0;
  function load() {
    var now = Date.now();
    if (inflight || now - lastTry < 3000) return;
    inflight = true; lastTry = now;
    fetch('/api/lpbook', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        inflight = false;
        /* an answer that nothing is open is an answer; only a failed fetch keeps the last cards */
        if (!v || v.error || !v.live) { stamp(true); return; }
        paint(v); lastGood = Date.now(); stamp(false);
        try { localStorage.setItem(KEY, JSON.stringify({ t: lastGood, v: v })); } catch (e) {}
      })
      .catch(function () { inflight = false; stamp(true); });
  }
  load();
  setInterval(load, 15000);                                  /* as on the LP Book */
  setInterval(function () { stamp(false); }, 1000);          /* the clock runs */
  /* a widget app may keep this alive and hidden for hours: refresh the moment it is shown */
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
